version: 1
package_key: MLS
sources:
  event_source:
    source_role: event_source
    file_pattern: schedule.xlsx
    sheet_name: 2026 Schedule
    header_row_index: 0
    field_mappings:
      event_date: Date
      event_display: Match
      event_time: Time
    metric_mappings: {}
    metadata_mappings: {}
    matchup_split:
      source_column: Match
      delimiter_pattern: \s+vs\.\s+
      left_team_field: home_team
      right_team_field: away_team
    event_datetime:
      datetime_column: null
      date_column: Date
      time_column: Time
      timezone: null
    event_id:
      source_columns:
      - Date
      - Match
      - Time
      strategy: concatenate
  metric_source_2025:
    source_role: metric_source
    file_pattern: file.xlsx
    sheet_name: 2025 Statistics
    header_row_index: 0
    field_mappings:
      player_name: Name
      team: Team
    metric_mappings:
      GOALS: G
      MATCHES_PLAYED: P
    metadata_mappings:
      RANK: RK
    matchup_split: null
    event_datetime: null
    event_id: null
  metric_source_2026:
    source_role: metric_source
    file_pattern: file.xlsx
    sheet_name: 2026 Stastics
    header_row_index: 0
    field_mappings:
      player_name: Name
      team: Team
    metric_mappings:
      GOALS: G
      MATCHES_PLAYED: P
    metadata_mappings:
      RANK: RK
    matchup_split: null
    event_datetime: null
    event_id: null
shape_signature:
  event_source:
    filename: schedule.xlsx
    sheets:
    - columns:
      - Date
      - Match
      - Time
      header_row_index: 0
      sheet_name: 2026 Schedule
  metric_source:
    filename: file.xlsx
    sheets:
    - columns:
      - RK
      - Name
      - Team
      - P
      - G
      header_row_index: 0
      sheet_name: 2025 Statistics
    - columns:
      - RK
      - Name
      - Team
      - P
      - G
      header_row_index: 0
      sheet_name: 2026 Stastics
notes: Event source uses Match split into home_team and away_team via 'vs.'. No timezone
  or year is explicitly present in the date values, so none was invented. Separate
  metric sources are proposed per sheet/year.
